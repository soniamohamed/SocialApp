<button
  type="button"
  (click)="toggleLanguage()"
  class="flex items-center gap-2
         rounded-xl border border-gray-200
         bg-white px-3 py-2
         text-sm font-semibold text-gray-700
         shadow-sm
         transition-all
         hover:border-blue-300
         hover:bg-blue-50
         hover:text-blue-600"
>
  <span>🌐</span>

  @if (currentLanguage() === 'en') {
    <span>العربية</span>
  } @else {
    <span>EN</span>
  }
</button>
