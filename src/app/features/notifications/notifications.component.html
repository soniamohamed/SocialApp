<div class="notif-wrapper">

  <div class="notif-container">

    <!-- Header & Controls -->
    <div class="notif-header-card">

      <div class="notif-header-row">

        <div class="notif-title-box">

          <h1>
            Notifications
          </h1>

          <p>
            Real-time updates for likes, comments, and follows.
          </p>

        </div>


        <button
          type="button"
          class="notif-read-btn"
        >

          <span>✓</span>

          Mark all as read

        </button>

      </div>


      <!-- Filters -->
      <div class="notif-filters-row">

        <button
          type="button"
          class="filter-btn active"
        >
          All
        </button>


        <button
          type="button"
          class="filter-btn"
        >

          Unread

          <span class="badge">
            2
          </span>

        </button>

      </div>

    </div>


    <!-- Empty State -->
    <div class="notif-empty-card">

      <div class="empty-icon">
        🔔
      </div>


      <div class="empty-text-box">

        <h3>
          No new notifications
        </h3>

        <p>
          When your friends interact with you or someone comments
          on your posts, you'll see the notifications here instantly.
        </p>

      </div>

    </div>

  </div>

</div>
