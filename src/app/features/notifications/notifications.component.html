<div class="notif-wrapper" dir="rtl">
  <div class="notif-container">
    
    <!-- قسم الهيدر والتحكم -->
    <div class="notif-header-card">
      <div class="notif-header-row">
        <div class="notif-title-box">
          <h1>الإشعارات</h1>
          <p>التحديثات الفورية للإعجابات، التعليقات، والمتابعات.</p>
        </div>
        <button class="notif-read-btn">
          <span>✓</span> تعيين الكل كمقروء
        </button>
      </div>

      <!-- أزرار الفلترة -->
      <div class="notif-filters-row">
        <button class="filter-btn active">الكل</button>
        <button class="filter-btn">
          غير المقروءة <span class="badge">2</span>
        </button>
      </div>
    </div>

    <!-- صندوق عرض الإشعارات (الحالة الفارغة) -->
    <div class="notif-empty-card">
      <div class="empty-icon">🔔</div>
      <div class="empty-text-box">
        <h3>لا توجد إشعارات جديدة</h3>
        <p>عندما يتفاعل معك أصدقاؤك أو يقوم شخص بالتعليق على منشوراتك، ستظهر التنبيهات هنا فوراً.</p>
      </div>
    </div>

  </div>
</div>
