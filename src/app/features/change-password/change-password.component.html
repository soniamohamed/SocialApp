<div class="cp-wrapper" dir="rtl">
  <div class="cp-container">
    
    <!-- بطاقة نموذج تغيير كلمة المرور -->
    <div class="cp-card">
      
      <!-- الهيدر -->
      <div class="cp-header">
        <div class="cp-icon">🔒</div>
        <h1>تغيير كلمة المرور</h1>
        <p>الرجاء إدخال كلمة المرور الحالية وكلمة المرور الجديدة لتأمين حسابك.</p>
      </div>

      <!-- الفورم -->
      <form class="cp-form">
        
        <!-- كلمة المرور الحالية -->
        <div class="cp-field">
          <label for="currentPassword">كلمة المرور الحالية</label>
          <input type="password" id="currentPassword" placeholder="••••••••" required>
        </div>

        <!-- كلمة المرور الجديدة -->
        <div class="cp-field">
          <label for="newPassword">كلمة المرور الجديدة</label>
          <input type="password" id="newPassword" placeholder="••••••••" required>
        </div>

        <!-- تأكيد كلمة المرور الجديدة -->
        <div class="cp-field">
          <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>

        <!-- زر الحفظ -->
        <button type="submit" class="cp-submit-btn">
          تغيير كلمة المرور
        </button>

      </form>

    </div>

  </div>
</div>
