<nav
  class="fixed inset-x-0 top-0 z-50 h-16
         border-b border-gray-200
         bg-white/95 backdrop-blur-md
         shadow-sm"
>
  <div class="mx-auto h-full max-w-7xl px-4 sm:px-6 lg:px-8">

    <div class="flex h-full items-center justify-between gap-4">

      <!-- ================= LOGO ================= -->
      <a
        routerLink="/feed"
        class="flex shrink-0 items-center gap-3"
      >
        <div class="relative">
          <img
            src="assets/images/logo.jpg"
            alt="Route Posts logo"
            class="h-10 w-10 rounded-full border-2 border-gray-200 object-cover"
          />
        </div>

        <span class="hidden text-lg font-bold text-gray-900 sm:block">
          Route Posts
        </span>
      </a>


      <!-- ================= CENTER NAVIGATION ================= -->
      <div
        class="hidden items-center gap-1
               rounded-2xl border border-gray-200
               bg-gray-100 p-1
               lg:flex"
      >

        <!-- Feed -->
        <a
          routerLink="/feed"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2
                 rounded-xl px-4 py-2
                 text-sm font-semibold text-gray-600
                 transition-all
                 hover:bg-white hover:text-blue-600"
        >
          <span>⌂</span>
          <span>Feed</span>
        </a>


        <!-- Profile -->
        <a
          routerLink="/profile"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          class="flex items-center gap-2
                 rounded-xl px-4 py-2
                 text-sm font-semibold text-gray-600
                 transition-all
                 hover:bg-white hover:text-blue-600"
        >
          <span>👤</span>
          <span>Profile</span>
        </a>


        <!-- Notifications -->
        <a
          routerLink="/notifications"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          class="flex items-center gap-2
                 rounded-xl px-4 py-2
                 text-sm font-semibold text-gray-600
                 transition-all
                 hover:bg-white hover:text-blue-600"
        >

          <!-- Notification icon + unread badge -->
          <span class="relative inline-flex items-center justify-center">

            <span>🔔</span>

            @if (unreadCount() > 0) {
              <span
                class="absolute -right-2 -top-2
                       flex h-4 min-w-4 items-center justify-center
                       rounded-full border border-white
                       bg-red-500 px-1
                       text-[10px] font-bold leading-none text-white"
                aria-label="Unread notifications"
              >
                {{ unreadCount() > 99 ? '99+' : unreadCount() }}
              </span>
            }

          </span>

          <span>Notifications</span>

        </a>

      </div>


      <!-- ================= USER MENU ================= -->
      <div class="relative shrink-0">

        <button
          type="button"
          (click)="toggleDropdown($event)"
          [attr.aria-expanded]="isDropdownOpen()"
          aria-label="Open user menu"
          class="flex cursor-pointer items-center gap-2
                 rounded-full border border-gray-200
                 bg-white p-1
                 transition-all
                 hover:bg-gray-50 hover:shadow-sm"
        >

          <!-- Avatar -->
          <img
            [src]="currentUser()?.photo || 'assets/images/user-avatar.jpg'"
            [alt]="(currentUser()?.name || 'User') + ' profile photo'"
            class="h-9 w-9 shrink-0 rounded-full
                   border border-gray-200 object-cover"
          />

          <!-- Name -->
          <span
            class="hidden max-w-32 truncate
                   text-sm font-semibold text-gray-700
                   md:block"
          >
            {{ currentUser()?.name || 'User' }}
          </span>

          <!-- Menu icon -->
          <span
            class="hidden h-8 w-8 items-center justify-center
                   rounded-full text-gray-500
                   hover:bg-gray-100 sm:flex"
          >
            ☰
          </span>

        </button>


        <!-- ================= DROPDOWN ================= -->
        @if (isDropdownOpen()) {

          <div
            class="dropdown-animation
                   absolute right-0 top-full z-[9999] mt-3
                   w-56 rounded-2xl
                   border border-gray-200
                   bg-white p-2
                   shadow-xl"
          >

            <!-- Profile -->
            <a
              routerLink="/profile"
              (click)="closeDropdown()"
              class="flex items-center gap-3
                     rounded-xl px-4 py-3
                     text-sm font-medium text-gray-700
                     transition hover:bg-gray-50"
            >
              <span>👤</span>
              <span>Profile Settings</span>
            </a>


            <!-- Change Password -->
            <a
              routerLink="/change-password"
              (click)="closeDropdown()"
              class="flex items-center gap-3
                     rounded-xl px-4 py-3
                     text-sm font-medium text-gray-700
                     transition hover:bg-gray-50"
            >
              <span>🔑</span>
              <span>Change Password</span>
            </a>


            <div class="my-2 border-t border-gray-100"></div>


            <!-- Logout -->
            <button
              type="button"
              (click)="logOut()"
              class="flex w-full cursor-pointer items-center gap-3
                     rounded-xl px-4 py-3
                     text-left text-sm font-medium text-red-600
                     transition hover:bg-red-50"
            >
              <span>🚪</span>
              <span>Logout</span>
            </button>

          </div>

        }

      </div>

    </div>

  </div>
</nav>
