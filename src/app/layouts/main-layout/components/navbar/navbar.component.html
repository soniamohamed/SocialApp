<nav class="bg-white border-b border-gray-200 fixed w-full z-50 top-0 start-0 shadow-xs">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo & Brand -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="bg-blue-700 text-white font-extrabold text-xs px-2.5 py-1.5 rounded-lg shadow-sm">
          ROUTE
        </div>
        <span class="text-base sm:text-lg font-bold text-gray-900 tracking-tight">Route Posts</span>
      </div>

   <!-- Center Navigation Links (تظهر في التابلت والكمبيوتر وتختفي في الموبايل) -->
   <div class="hidden md:flex items-center bg-gray-50 border border-gray-200 rounded-full p-1 shadow-inner gap-1">
     
     <!-- Feed Link -->
     <a routerLink="/feed" routerLinkActive="!bg-white !text-blue-700 !shadow-sm font-bold [&_span.indicator]:bg-blue-600" [routerLinkActiveOptions]="{exact: true}" class="group flex items-center gap-2 px-3 lg:px-4 py-2 text-sm font-semibold rounded-full text-gray-600 hover:text-blue-700 hover:bg-gray-100 transition-all">
       
       <span>🏠</span> Feed
     </a>

     <!-- Profile Link -->
     <a routerLink="/profile" routerLinkActive="!bg-white !text-blue-700 !shadow-sm font-bold [&_span.indicator]:bg-blue-600" class="group flex items-center gap-2 px-3 lg:px-4 py-2 text-sm font-semibold rounded-full text-gray-600 hover:text-blue-700 hover:bg-gray-100 transition-all">
       
       <span>👤</span> Profile
     </a>

     <!-- Notifications Link -->
     <a routerLink="/notifications" routerLinkActive="!bg-white !text-blue-700 !shadow-sm font-bold [&_span.indicator]:bg-blue-600" class="group flex items-center gap-2 px-3 lg:px-4 py-2 text-sm font-semibold rounded-full text-gray-600 hover:text-blue-700 hover:bg-gray-100 transition-colors">
        
       <span>💬</span> Notifications
     </a>

   </div>

      <!-- Right Side: User Profile & Dropdown Menu -->
      <div class="relative profile-dropdown">
        <button 
          (click)="toggleDropdown()" 
          class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-full py-1 px-2.5 sm:px-3 hover:bg-gray-100 cursor-pointer transition-all focus:outline-none"
        >
          <img class="w-7 h-7 sm:w-8 sm:h-8 rounded-full object-cover border border-gray-300" src="assets/images/user-avatar.jpg" alt="user photo" onerror="this.src='https://via.placeholder.com/150'">
          <span class="text-sm font-semibold text-gray-900 hidden sm:inline">sonia mohamed</span>
          <span class="text-gray-500 text-xs font-bold ml-1">☰</span>
        </button>

        <!-- Dropdown Menu -->
        @if (isDropdownOpen) {
          <div class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-2xl shadow-xl py-2 z-50">
            <!-- روابط تظهر في الموبايل داخل القائمة المنسدلة لسهولة التصفح -->
            <div class="md:hidden border-b border-gray-100 pb-1 mb-1">
              <a routerLink="/feed"   (click)="closeDropdown()" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <span>🏠</span> Feed
              </a>
              <a routerLink="/profile"   (click)="closeDropdown()" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <span>👤</span> Profile
              </a>
              <a routerLink="/notifications" (click)="closeDropdown()" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                <span>💬</span> Notifications
              </a>
            </div>

            <a routerLink="/profile" (click)="closeDropdown()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="text-gray-500">👤</span> Profile Settings
            </a>
            <a routerLink="/change-password" (click)="closeDropdown()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="text-gray-500">🔑</span> Change Password
            </a>
            <div class="border-t border-gray-100 my-1"></div>
            <button (click)="logOut()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors text-left font-medium cursor-pointer">
              <span class="text-red-500">🚪</span> Logout
            </button>
          </div>
        }
      </div>

    </div>
  </div>
</nav>
